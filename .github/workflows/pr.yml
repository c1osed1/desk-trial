name: pr

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hiring
          POSTGRES_PASSWORD: hiring
          POSTGRES_DB: hiring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiring -d hiring"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hiring:hiring@127.0.0.1:5432/hiring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: rest
        env:
          TRIAL_SEAL_KEY: ${{ secrets.TRIAL_SEAL_KEY }}
        run: |
          printf '%s\n' "$TRIAL_SEAL_KEY" > /tmp/seal.key
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/seal.key -in .ci/suite.enc \
            | tar -xz
          npx vitest run --config vitest.full.config.ts
